<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | Free Would</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        .error-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            background: var(--dark-bg);
            position: relative;
            overflow: hidden;
        }
        .error-page::before {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(124,58,237,0.15), transparent 70%);
            top: -100px;
            right: -100px;
            border-radius: 50%;
        }
        .error-page::after {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(6,182,212,0.1), transparent 70%);
            bottom: -50px;
            left: -50px;
            border-radius: 50%;
        }
        .error-content {
            position: relative;
            z-index: 1;
        }
        .error-number {
            font-size: 10rem;
            font-weight: 800;
            background: var(--gradient-1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1;
            margin-bottom: 10px;
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }
        .error-title {
            font-size: 2rem;
            color: var(--text-primary);
            margin-bottom: 15px;
        }
        .error-desc {
            color: var(--text-secondary);
            font-size: 1rem;
            max-width: 500px;
            margin: 0 auto 30px;
        }
        .error-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 14px 30px;
            background: var(--gradient-1);
            color: #fff;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 600;
            transition: all 0.3s;
        }
        .error-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 0 30px rgba(124,58,237,0.4);
        }
        .error-icon {
            font-size: 4rem;
            color: var(--text-secondary);
            margin-bottom: 20px;
            opacity: 0.5;
        }
    </style>
</head>
<body>
    <div class="error-page">
        <div class="error-content">
            <div class="error-icon"><i class="fas fa-ghost"></i></div>
            <div class="error-number">404</div>
            <h1 class="error-title">Page Not Found</h1>
            <p class="error-desc">Oops! The page you're looking for doesn't exist or has been moved. Let's get you back on track.</p>
            <a href="index.html" class="error-btn"><i class="fas fa-arrow-left"></i> Go Home</a>
        </div>
    </div>
</body>
</html>
