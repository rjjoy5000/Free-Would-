<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management - Free Would Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body>
    <div class="dashboard-layout">
        <aside class="sidebar admin-sidebar" id="sidebar">
            <div class="sidebar-logo">
                <i class="fas fa-shield-halved"></i>
                <span>Admin Panel</span>
            </div>
            <nav class="sidebar-nav">
                <a href="index.html"><i class="fas fa-grid"></i> Dashboard</a>
                <a href="users.html" class="active"><i class="fas fa-users"></i> Users</a>
                <a href="api-settings.html"><i class="fas fa-key"></i> API Settings</a>
                <a href="analytics.html"><i class="fas fa-chart-line"></i> Analytics</a>
                <a href="plans.html"><i class="fas fa-tags"></i> Plans</a>
                <a href="settings.html"><i class="fas fa-gear"></i> Settings</a>
                <hr style="border-color:var(--card-border);margin:10px 15px;">
                <a href="../index.html"><i class="fas fa-arrow-left"></i> Back to Site</a>
            </nav>
        </aside>

        <div class="main-content">
            <nav class="top-navbar">
                <div class="navbar-left">
                    <button class="sidebar-toggle" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
                    <h2 style="color:var(--text-primary);font-size:1.1rem;">User Management</h2>
                </div>
                <div class="navbar-right">
                    <button class="btn-save" onclick="exportUsers()"><i class="fas fa-download"></i> Export CSV</button>
                </div>
            </nav>

            <div class="page-content">
                <!-- Filters -->
                <div class="card" style="margin-bottom:20px;">
                    <div style="display:flex;gap:15px;flex-wrap:wrap;align-items:center;">
                        <div class="search-box" style="flex:1;min-width:200px;">
                            <i class="fas fa-search"></i>
                            <input type="text" placeholder="Search users..." id="userSearch" oninput="searchUsers()">
                        </div>
                        <select style="background:var(--dark-bg);border:1px solid var(--card-border);border-radius:8px;padding:8px 12px;color:var(--text-primary);font-family:'Poppins',sans-serif;" id="roleFilter" onchange="filterUsers()">
                            <option value="">All Roles</option>
                            <option value="user">User</option>
                            <option value="admin">Admin</option>
                        </select>
                        <select style="background:var(--dark-bg);border:1px solid var(--card-border);border-radius:8px;padding:8px 12px;color:var(--text-primary);font-family:'Poppins',sans-serif;" id="statusFilter" onchange="filterUsers()">
                            <option value="">All Status</option>
                            <option value="active">Active</option>
                            <option value="banned">Banned</option>
                        </select>
                    </div>
                </div>

                <!-- Users Table -->
                <div class="card">
                    <div class="table-container">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th><input type="checkbox" id="selectAll" onchange="toggleSelectAll()"></th>
                                    <th>ID</th>
                                    <th>Name</th>
                                    <th>Email</th>
                                    <th>Role</th>
                                    <th>Credits</th>
                                    <th>Plan</th>
                                    <th>Status</th>
                                    <th>Joined</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="usersTableBody">
                                <tr>
                                    <td><input type="checkbox" class="user-check"></td>
                                    <td>1</td>
                                    <td>Admin</td>
                                    <td>admin@freewould.com</td>
                                    <td><span class="status success">Admin</span></td>
                                    <td>999999</td>
                                    <td>Enterprise</td>
                                    <td><span class="status success">Active</span></td>
                                    <td>2026-01-01</td>
                                    <td>
                                        <div style="display:flex;gap:5px;">
                                            <button onclick="editUser(1)" style="background:var(--primary);border:none;color:#fff;padding:5px 8px;border-radius:5px;cursor:pointer;font-size:0.8rem;"><i class="fas fa-pen"></i></button>
                                            <button onclick="banUser(1)" style="background:var(--warning);border:none;color:#fff;padding:5px 8px;border-radius:5px;cursor:pointer;font-size:0.8rem;"><i class="fas fa-ban"></i></button>
                                            <button onclick="deleteUser(1)" style="background:var(--danger);border:none;color:#fff;padding:5px 8px;border-radius:5px;cursor:pointer;font-size:0.8rem;"><i class="fas fa-trash"></i></button>
                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- Pagination -->
                <div class="pagination" id="usersPagination">
                    <button><i class="fas fa-chevron-left"></i></button>
                    <button class="active">1</button>
                    <button>2</button>
                    <button>3</button>
                    <button><i class="fas fa-chevron-right"></i></button>
                </div>
            </div>
        </div>
    </div>

    <!-- Edit User Modal -->
    <div class="modal-overlay" id="editModal" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.6);z-index:10000;align-items:center;justify-content:center;">
        <div class="modal" style="background:var(--card-bg);border:1px solid var(--card-border);border-radius:12px;padding:25px;width:90%;max-width:500px;">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
                <h2 style="color:var(--text-primary);font-size:1.2rem;">Edit User</h2>
                <button onclick="closeModal()" style="background:none;border:none;color:var(--text-secondary);cursor:pointer;font-size:1.2rem;"><i class="fas fa-times"></i></button>
            </div>
            <form onsubmit="saveUser(event)">
                <input type="hidden" id="editUserId">
                <div class="form-group">
                    <label>Name</label>
                    <input type="text" id="editName" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="editEmail" required>
                </div>
                <div class="form-group">
                    <label>Role</label>
                    <select id="editRole">
                        <option value="user">User</option>
                        <option value="admin">Admin</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Credits</label>
                    <input type="number" id="editCredits" min="0">
                </div>
                <div class="form-group">
                    <label>Plan</label>
                    <select id="editPlan">
                        <option value="free">Free</option>
                        <option value="pro">Pro</option>
                        <option value="enterprise">Enterprise</option>
                    </select>
                </div>
                <div class="btn-group">
                    <button type="submit" class="btn-save">Save Changes</button>
                    <button type="button" class="btn-danger-outline" onclick="closeModal()">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script src="../assets/js/main.js"></script>
    <script src="../assets/js/admin.js"></script>
</body>
</html>
